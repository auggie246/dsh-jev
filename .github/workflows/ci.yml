name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The offline fake Judge: proves the built CLI and the shipped seed set work with no key and no network.
      - run: node lib/calibrate-cli.js golden/gate.seed.json --judge fake
      - run: node lib/calibrate-cli.js golden/gate.scripts.json --judge fake --send-scripts
